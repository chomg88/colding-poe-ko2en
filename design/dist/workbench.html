<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<title>작업대</title>
<style>
/* ─────────────────────────────────────────────────────────────
   POE 툴박스 — 디자인 토큰
   단일 출처. design/build.py 가 미리보기와 web/src/styles/tokens.css
   양쪽으로 내보낸다. 여기만 고치면 둘 다 따라온다.

   다크 단일 테마. Path of Exile 의 화면은 어두운 것이 전제라
   밝은 테마를 같이 끌고 가면 분위기가 사라진다.
   ───────────────────────────────────────────────────────────── */
:root{
  /* 바탕 — 그을음과 쇠. 순수 회색이 아니라 따뜻한 쪽으로 치우쳐 있다 */
  --bg:#0b0a09;
  --panel:#14120f;
  --panel-2:#1b1815;
  --sunken:#080706;

  /* 테두리 — PoE UI 는 각지고 얇다 */
  --line:#2c2721;
  --line-2:#3d362d;
  --line-hi:#4a4034;

  /* 글자 — 양피지 */
  --ink:#cfc7b8;
  --ink-2:#a29a8c;
  --muted:#7d7568;
  --faint:#5c554b;

  /* 액센트 — 고유 아이템 글자색 */
  --accent:#af6025;
  --accent-hi:#d07c3a;
  --accent-soft:rgba(175,96,37,.14);

  /* 등급색. 게임이 쓰는 값 그대로다. 의미색을 여기서 파생시켜
     시스템 전체가 한 팔레트 위에 서게 한다 */
  --r-normal:#c8c8c8;
  --r-magic:#8888ff;
  --r-rare:#ffff77;
  --r-unique:#af6025;
  --r-gem:#1ba29b;
  --r-currency:#aa9e82;
  --r-divination:#14b7ff;
  --r-corrupt:#d20000;

  /* 등급 테두리. 글자색을 그대로 테두리에 쓰면 화면에서 과하다.
     게임의 아이템 툴팁 테두리처럼 어둡게 가라앉힌 값을 따로 둔다 */
  --rb-normal:#4a4a4a;
  --rb-magic:#3a3a72;
  --rb-rare:#5c5c2e;
  --rb-unique:#5c3a19;

  /* 의미색 — 등급색에서 끌어온다 */
  --st-ok:#8888ff;        /* 마법 파랑 = 옵션 매칭. 게임의 속성 글자색과 같다 */
  --st-warn:#ffff77;      /* 희귀 노랑 = 후보 여럿 */
  --st-info:#1ba29b;      /* 젬 청록 = 베이스타입 복원 */
  --st-bad:#e0563f;       /* 타락 적색을 화면용으로 누그러뜨림 */
  --st-mute:#7d7568;

  /* 서체 — 한글이 깨지지 않는 것이 우선이다.
     라틴 전용 세리프는 영문 아이템명·라벨에만 쓴다 */
  --f-display:"Iowan Old Style",Georgia,Palatino,"Times New Roman",serif;
  --f-body:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",
           -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --f-mono:ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;

  /* 크기 */
  --t-xs:11px; --t-sm:12.5px; --t-md:14px; --t-base:15px;
  --t-lg:17px; --t-xl:20px; --t-2xl:26px; --t-3xl:34px;

  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px;
  --sp-5:24px; --sp-6:32px; --sp-7:48px; --sp-8:64px;

  --r-sm:2px; --r-md:4px; --r-lg:6px;

  --wrap:1120px;
}

*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:var(--f-body); font-size:var(--t-base); line-height:1.65;
  -webkit-font-smoothing:antialiased; padding:24px;
}
</style>
</head><body>
<style>
  .tool{
    display:grid; grid-template-columns:1fr 1fr; height:300px; max-width:800px;
    border:1px solid var(--line-2); border-radius:var(--r-md); overflow:hidden;
    background:var(--panel); position:relative;
  }
  .pane{display:flex; flex-direction:column; min-width:0}
  .pane + .pane{border-left:1px solid var(--line-2)}
  .head{
    display:flex; align-items:center; gap:10px; padding:8px 14px; flex:none;
    border-bottom:1px solid var(--line); background:var(--panel-2);
  }
  .lbl{font-size:var(--t-xs); letter-spacing:.09em; text-transform:uppercase;
       color:var(--faint); font-weight:700}
  .grow{margin-left:auto; display:flex; gap:6px}
  .btn{font-family:var(--f-body); font-size:var(--t-sm); font-weight:550; color:var(--ink-2);
    background:var(--panel-2); border:1px solid var(--line-2); border-radius:var(--r-sm);
    padding:4px 11px; cursor:pointer}
  .btn.primary{background:var(--accent-soft); border-color:var(--accent); color:var(--accent-hi)}
  .well{
    flex:1; padding:12px 14px; background:var(--sunken); color:var(--ink);
    font-family:var(--f-body); font-size:var(--t-md); line-height:1.75; overflow:hidden;
  }
  .well .ph{color:var(--faint)}
  .res{flex:1; background:var(--sunken); padding:10px 0; overflow:hidden}
  .ln{display:flex; gap:10px; padding:1px 14px 1px 0; border-left:2px solid transparent;
      font-family:var(--f-mono); font-size:12px; line-height:1.7; color:var(--ink)}
  .ln .txt{padding-left:14px}
  .ln.ok{border-left-color:var(--st-ok)}
  .ln.frame{border-left-color:var(--st-mute); color:var(--ink-2)}
  .tally{font-size:var(--t-sm); color:var(--muted)}
  .tally b{color:var(--ink-2); font-variant-numeric:tabular-nums}
  .cap{font-size:var(--t-xs); color:var(--faint); letter-spacing:.08em;
       text-transform:uppercase; margin:0 0 6px; font-weight:700}
  /* 로딩 — 사전 3.7MB 를 받는 동안 */
  .veil{position:absolute; inset:0; display:grid; place-content:center; gap:12px;
    justify-items:center; background:var(--panel); color:var(--muted); font-size:var(--t-sm)}
  .bar{width:180px; height:2px; background:var(--line-2); overflow:hidden}
  .bar i{display:block; height:100%; width:40%; background:var(--accent); animation:sl 1.1s ease-in-out infinite}
  @keyframes sl{0%{transform:translateX(-100%)}100%{transform:translateX(320%)}}
  @media (prefers-reduced-motion:reduce){.bar i{animation:none; width:100%}}
  .pair{display:grid; gap:var(--sp-5)}
</style>
<div class="pair">
  <div>
    <p class="cap">작동 중</p>
    <div class="tool">
      <section class="pane">
        <div class="head">
          <span class="lbl">한글 원문</span>
          <div class="grow"><button class="btn">예시</button><button class="btn">비우기</button></div>
        </div>
        <div class="well">아이템 종류: 방패<br>아이템 희귀도: 희귀<br>솔 수호<br>칠흑의 거대 방패<br>--------<br>생명력 최대치 +72</div>
      </section>
      <section class="pane">
        <div class="head">
          <span class="lbl">영문 결과</span>
          <span class="tally">매칭 <b>100%</b></span>
          <div class="grow"><button class="btn primary">복사</button></div>
        </div>
        <div class="res">
          <div class="ln frame"><span class="txt">Item Class: Shields</span></div>
          <div class="ln frame"><span class="txt">Rarity: Rare</span></div>
          <div class="ln ok"><span class="txt">Sol Guard</span></div>
          <div class="ln ok"><span class="txt">Ebony Tower Shield</span></div>
          <div class="ln ok"><span class="txt">+72 to maximum Life</span></div>
        </div>
      </section>
    </div>
  </div>
  <div>
    <p class="cap">사전 로딩 중</p>
    <div class="tool" style="height:120px">
      <div class="veil"><div class="bar"><i></i></div><div>번역 사전 내려받는 중 · 3.7MB</div></div>
    </div>
  </div>
</div>
</body></html>
