<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<title>사이트 크롬</title>
<style>
/* ─────────────────────────────────────────────────────────────
   POE 툴박스 — 디자인 토큰
   단일 출처. design/build.py 가 미리보기와 web/src/styles/tokens.css
   양쪽으로 내보낸다. 여기만 고치면 둘 다 따라온다.

   다크 단일 테마. Path of Exile 의 화면은 어두운 것이 전제라
   밝은 테마를 같이 끌고 가면 분위기가 사라진다.
   ───────────────────────────────────────────────────────────── */
:root{
  /* 바탕 — 그을음과 쇠. 순수 회색이 아니라 따뜻한 쪽으로 치우쳐 있다 */
  --bg:#0b0a09;
  --panel:#14120f;
  --panel-2:#1b1815;
  --sunken:#080706;

  /* 테두리 — PoE UI 는 각지고 얇다 */
  --line:#2c2721;
  --line-2:#3d362d;
  --line-hi:#4a4034;

  /* 글자 — 양피지 */
  --ink:#cfc7b8;
  --ink-2:#a29a8c;
  --muted:#7d7568;
  --faint:#5c554b;

  /* 액센트 — 고유 아이템 글자색 */
  --accent:#af6025;
  --accent-hi:#d07c3a;
  --accent-soft:rgba(175,96,37,.14);

  /* 등급색. 게임이 쓰는 값 그대로다. 의미색을 여기서 파생시켜
     시스템 전체가 한 팔레트 위에 서게 한다 */
  --r-normal:#c8c8c8;
  --r-magic:#8888ff;
  --r-rare:#ffff77;
  --r-unique:#af6025;
  --r-gem:#1ba29b;
  --r-currency:#aa9e82;
  --r-divination:#14b7ff;
  --r-corrupt:#d20000;

  /* 등급 테두리. 글자색을 그대로 테두리에 쓰면 화면에서 과하다.
     게임의 아이템 툴팁 테두리처럼 어둡게 가라앉힌 값을 따로 둔다 */
  --rb-normal:#4a4a4a;
  --rb-magic:#3a3a72;
  --rb-rare:#5c5c2e;
  --rb-unique:#5c3a19;

  /* 의미색 — 등급색에서 끌어온다 */
  --st-ok:#8888ff;        /* 마법 파랑 = 옵션 매칭. 게임의 속성 글자색과 같다 */
  --st-warn:#ffff77;      /* 희귀 노랑 = 후보 여럿 */
  --st-info:#1ba29b;      /* 젬 청록 = 베이스타입 복원 */
  --st-bad:#e0563f;       /* 타락 적색을 화면용으로 누그러뜨림 */
  --st-mute:#7d7568;

  /* 서체 — 한글이 깨지지 않는 것이 우선이다.
     라틴 전용 세리프는 영문 아이템명·라벨에만 쓴다 */
  --f-display:"Iowan Old Style",Georgia,Palatino,"Times New Roman",serif;
  --f-body:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",
           -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --f-mono:ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;

  /* 크기 */
  --t-xs:11px; --t-sm:12.5px; --t-md:14px; --t-base:15px;
  --t-lg:17px; --t-xl:20px; --t-2xl:26px; --t-3xl:34px;

  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px;
  --sp-5:24px; --sp-6:32px; --sp-7:48px; --sp-8:64px;

  --r-sm:2px; --r-md:4px; --r-lg:6px;

  --wrap:1120px;
}

*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:var(--f-body); font-size:var(--t-base); line-height:1.65;
  -webkit-font-smoothing:antialiased; padding:24px;
}
</style>
</head><body>
<style>
  .frame{border:1px solid var(--line-2); border-radius:var(--r-md); overflow:hidden; background:var(--bg); max-width:800px}
  .head{display:flex; align-items:center; gap:22px; height:52px; padding:0 20px;
    background:var(--panel-2); border-bottom:1px solid var(--line-2)}
  .brand{display:flex; align-items:center; gap:8px; font-weight:680; font-size:var(--t-base); color:var(--ink)}
  /* 마름모 하나. 게임 UI 의 각진 느낌을 아주 작게만 빌려온다 */
  .brand .mk{width:7px; height:7px; background:var(--accent); transform:rotate(45deg)}
  .nav{margin-left:auto; display:flex; gap:18px; font-size:var(--t-md)}
  .nav a{color:var(--muted); text-decoration:none; font-weight:550}
  .nav a[aria-current]{color:var(--ink)}
  .nav a[aria-current]{position:relative}
  .nav a[aria-current]::after{content:""; position:absolute; left:0; right:0; bottom:-17px;
    height:2px; background:var(--accent)}
  .body{padding:26px 20px; min-height:150px}
  .body h1{font-size:26px; margin:0 0 10px; font-weight:660; color:var(--ink)}
  .body p{margin:0; color:var(--muted); font-size:var(--t-md); max-width:58ch; line-height:1.7}
  .foot{display:flex; gap:18px; align-items:center; padding:18px 20px;
    border-top:1px solid var(--line); background:var(--panel-2); font-size:var(--t-sm); color:var(--faint)}
  .foot nav{margin-left:auto; display:flex; gap:16px}
  .foot a{color:var(--muted); text-decoration:none}
</style>
<div class="frame">
  <header class="head">
    <span class="brand"><span class="mk"></span>POE 툴박스</span>
    <nav class="nav"><a href="#" aria-current="page">도구</a><a href="#">가이드</a></nav>
  </header>
  <div class="body">
    <h1>아이템 역번역기</h1>
    <p>게임에서 아이템을 복사한 뒤 왼쪽에 붙여넣으세요. 영문 Path of Building 의
       아이템 입력칸에 그대로 넣을 수 있는 형태로 바꿔 줍니다.</p>
  </div>
  <footer class="foot">
    <span>모든 처리는 브라우저 안에서 이루어집니다.</span>
    <nav><a href="#">개인정보처리방침</a><a href="#">GitHub</a></nav>
  </footer>
</div>
</body></html>
