<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<title>도구 카드</title>
<style>
/* ─────────────────────────────────────────────────────────────
   POE 툴박스 — 디자인 토큰
   단일 출처. design/build.py 가 미리보기와 web/src/styles/tokens.css
   양쪽으로 내보낸다. 여기만 고치면 둘 다 따라온다.

   다크 단일 테마. Path of Exile 의 화면은 어두운 것이 전제라
   밝은 테마를 같이 끌고 가면 분위기가 사라진다.
   ───────────────────────────────────────────────────────────── */
:root{
  /* 바탕 — 그을음과 쇠. 순수 회색이 아니라 따뜻한 쪽으로 치우쳐 있다 */
  --bg:#0b0a09;
  --panel:#14120f;
  --panel-2:#1b1815;
  --sunken:#080706;

  /* 테두리 — PoE UI 는 각지고 얇다 */
  --line:#2c2721;
  --line-2:#3d362d;
  --line-hi:#4a4034;

  /* 글자 — 양피지 */
  --ink:#cfc7b8;
  --ink-2:#a29a8c;
  --muted:#7d7568;
  --faint:#5c554b;

  /* 액센트 — 고유 아이템 글자색 */
  --accent:#af6025;
  --accent-hi:#d07c3a;
  --accent-soft:rgba(175,96,37,.14);

  /* 등급색. 게임이 쓰는 값 그대로다. 의미색을 여기서 파생시켜
     시스템 전체가 한 팔레트 위에 서게 한다 */
  --r-normal:#c8c8c8;
  --r-magic:#8888ff;
  --r-rare:#ffff77;
  --r-unique:#af6025;
  --r-gem:#1ba29b;
  --r-currency:#aa9e82;
  --r-divination:#14b7ff;
  --r-corrupt:#d20000;

  /* 등급 테두리. 글자색을 그대로 테두리에 쓰면 화면에서 과하다.
     게임의 아이템 툴팁 테두리처럼 어둡게 가라앉힌 값을 따로 둔다 */
  --rb-normal:#4a4a4a;
  --rb-magic:#3a3a72;
  --rb-rare:#5c5c2e;
  --rb-unique:#5c3a19;

  /* 의미색 — 등급색에서 끌어온다 */
  --st-ok:#8888ff;        /* 마법 파랑 = 옵션 매칭. 게임의 속성 글자색과 같다 */
  --st-warn:#ffff77;      /* 희귀 노랑 = 후보 여럿 */
  --st-info:#1ba29b;      /* 젬 청록 = 베이스타입 복원 */
  --st-bad:#e0563f;       /* 타락 적색을 화면용으로 누그러뜨림 */
  --st-mute:#7d7568;

  /* 서체 — 한글이 깨지지 않는 것이 우선이다.
     라틴 전용 세리프는 영문 아이템명·라벨에만 쓴다 */
  --f-display:"Iowan Old Style",Georgia,Palatino,"Times New Roman",serif;
  --f-body:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",
           -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --f-mono:ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;

  /* 크기 */
  --t-xs:11px; --t-sm:12.5px; --t-md:14px; --t-base:15px;
  --t-lg:17px; --t-xl:20px; --t-2xl:26px; --t-3xl:34px;

  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px;
  --sp-5:24px; --sp-6:32px; --sp-7:48px; --sp-8:64px;

  --r-sm:2px; --r-md:4px; --r-lg:6px;

  --wrap:1120px;
}

*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:var(--f-body); font-size:var(--t-base); line-height:1.65;
  -webkit-font-smoothing:antialiased; padding:24px;
}
</style>
</head><body>
<style>
  .tools{list-style:none; margin:0; padding:0; display:grid; gap:14px;
    grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); max-width:720px}
  .tools a{
    display:block; height:100%; padding:20px; color:inherit; text-decoration:none;
    background:var(--panel); border:1px solid var(--line-2); border-radius:var(--r-md);
    position:relative; transition:border-color .14s ease, background .14s ease;
  }
  /* 위쪽 모서리에 등급색 실선 하나. 게임의 아이템 테두리에서 가져온 신호 */
  .tools a::before{
    content:""; position:absolute; inset:-1px -1px auto -1px; height:2px;
    background:var(--accent); opacity:.65; border-radius:var(--r-md) var(--r-md) 0 0;
  }
  .tools a:hover{border-color:var(--line-hi); background:var(--panel-2)}
  .tools a:hover::before{opacity:1}
  .tools h2{font-size:17px; font-weight:650; margin:0; color:var(--ink)}
  .tools p{margin:8px 0 0; font-size:var(--t-md); color:var(--muted); line-height:1.6}
  .tags{display:flex; gap:6px; margin-top:14px}
  .tags span{
    font-size:var(--t-xs); letter-spacing:.04em; color:var(--faint);
    border:1px solid var(--line-2); border-radius:99px; padding:1px 9px;
  }
  .soon{padding:20px; border:1px dashed var(--line-2); border-radius:var(--r-md); color:var(--faint)}
  .soon h2{font-size:17px; margin:0; color:var(--faint); font-weight:650}
  .soon p{margin:8px 0 0; font-size:var(--t-md); line-height:1.6}
</style>
<ul class="tools">
  <li>
    <a href="#">
      <h2>아이템 역번역기</h2>
      <p>한글 클라이언트에서 복사한 아이템을 영문 Path of Building 이 읽는 형태로 되돌립니다.</p>
      <div class="tags"><span>번역</span><span>POB</span></div>
    </a>
  </li>
  <li class="soon">
    <h2>준비 중</h2>
    <p>도구를 계속 추가할 예정입니다. 필요한 게 있으면 GitHub 이슈로 알려주세요.</p>
  </li>
</ul>
</body></html>
